name: Nightly

# The slow checks: the speed lane of the engine (report only) and the next TypeScript.
# Each job keeps its report as an artifact.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      compare:
        description: "A git ref to bench in the same job, for example main. Empty: no comparison."
        required: false
        default: ""

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: speed (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p reports && pnpm bench | tee reports/bench.txt
      # The same runner benches the ref of the comparison, thus the two reports have the same machine
      - name: Bench the ref of the comparison
        if: inputs.compare != ''
        env:
          COMPARE: ${{ inputs.compare }}
        run: |
          git fetch --no-tags --depth=1 origin "$COMPARE"
          git worktree add ../compare FETCH_HEAD
          cd ../compare
          pnpm install --frozen-lockfile
          pnpm bench | tee "$GITHUB_WORKSPACE/reports/bench-compare.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: reports/

  typescript-next:
    name: typescript@next
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A failure here is an early warning, not a defect of render.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check with the next TypeScript
        run: |
          for p in optional dsl node biblo splay pack seat viewer; do
            for c in tsconfig.json tsconfig.test.json; do
              pnpm dlx --package=typescript@next tsc -p "packages/$p/$c" --noEmit
            done
          done
