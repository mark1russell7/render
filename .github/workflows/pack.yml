name: Pack

# The tarballs of the published packages, built and checked in CI, for the first publish from the
# computer of the owner. npm trusts the release workflow only for a package that exists, thus the
# first version of each package is published by hand: scripts/npm-bootstrap.mjs downloads these
# tarballs, publishes them, and then connects each package to release.yml.
on:
  workflow_dispatch:

permissions: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds each package, and checks each tarball (publint, attw, an install and a program)
      - run: pnpm check:packages
      - name: Pack each published package
        run: |
          mkdir -p tarballs
          for p in optional dsl node biblo splay pack seat viewer; do
            (cd "packages/$p" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs")
          done
          ls -l tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: render-tarballs
          path: tarballs/*.tgz
          if-no-files-found: error
