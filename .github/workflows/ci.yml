name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks of each Node.js version: the shared CI of mark1russell7 (reusable-ci.yml of
  # mark1russell7/template, its CI.md)
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@e7e62730936c2af2aab836d96f7553488375613b # main
    permissions:
      contents: read
    with:
      # typecheck: the source and the tests of each package (tsconfig.json and tsconfig.test.json).
      # lint: Oxlint with type-aware rules.
      # test:coverage: the coverage of the engine packages, with the floor of vitest.config.ts.
      # lint:ste: the writing rules (ASD-STE100) of the README files, the docs, the site and the doc comments.
      scripts: typecheck lint test test:coverage lint:ste
      node-versions: '["22", "24", "26"]'

  # The viewer in Chromium, Firefox and WebKit, and on two phones: the production build and the Playwright tests of each flow
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mark1russell7/render-viewer exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - name: Upload the Playwright report of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: viewer-test-results
          path: packages/viewer/test-results/
          if-no-files-found: ignore

  # The site: the test report, the static build and the smoke tests of each route and each widget
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @render/site run report
      - run: pnpm --filter @render/site run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - run: pnpm --filter @render/site exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @render/site run test:e2e
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

  # The npm packages: the build, publint, attw, and an empty project that installs, runs and type-checks the tarballs
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:packages

  # The only check that a pull request must pass
  ci-ok:
    name: CI OK
    if: always()
    needs: [ci, viewer, site, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: All jobs passed
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
